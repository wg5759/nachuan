name: finalize-early-access

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable vX.Y.Z tag; dispatch this workflow with the same tag as its Git ref
        required: true
        type: string
      variant:
        description: Early-access variant (full still requires reviewed runtime inputs)
        required: true
        default: lean
        type: choice
        options:
          - lean
          - full
      confirmation:
        description: Type FINALIZE-NACHUAN-EARLY-ACCESS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: early-access-finalize-${{ inputs.variant }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.14.0'
  NPM_VERSION: '11.12.1'
  UV_VERSION: '0.11.3'
  PYTHON_VERSION: '3.12.9'
  UV_PYTHON: '3.12.9'
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NODE_OPTIONS: ''
  NODE_PATH: ''
  NODE_EXTRA_CA_CERTS: ''
  NODE_TLS_REJECT_UNAUTHORIZED: ''
  ELECTRON_RUN_AS_NODE: ''
  ELECTRON_MIRROR: ''
  ELECTRON_BUILDER_BINARIES_MIRROR: ''
  ELECTRON_CUSTOM_DIR: ''
  ELECTRON_CUSTOM_FILENAME: ''
  ELECTRON_CUSTOM_VERSION: ''
  ELECTRON_OVERRIDE_DIST_PATH: ''
  ESBUILD_BINARY_PATH: ''
  npm_config_electron_mirror: ''
  npm_config_electron_builder_binaries_mirror: ''
  npm_config_electron_custom_dir: ''
  npm_config_electron_custom_filename: ''
  npm_config_electron_custom_version: ''
  npm_config_electron_override_dist_path: ''
  npm_config_esbuild_binary_path: ''
  npm_config_node_options: ''
  npm_config_script_shell: 'C:\Windows\System32\cmd.exe'
  NPM_CONFIG_STRICT_SSL: 'true'
  PYTHONHOME: ''
  PYTHONPATH: ''
  PYTHONSTARTUP: ''
  PYTHONUSERBASE: ''
  NACHUAN_RELEASE_TAG: ${{ inputs.release_tag }}
  NACHUAN_RELEASE_COMMIT: ${{ github.sha }}
  NACHUAN_RELEASE_RUN_ID: ${{ github.run_id }}

jobs:
  finalize:
    runs-on: windows-latest
    environment: early-access-finalizer
    steps:
      - name: Validate explicit early-access finalization intent
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:CONFIRMATION -cne 'FINALIZE-NACHUAN-EARLY-ACCESS') { throw 'Early-access finalization confirmation is missing' }
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$') { throw 'release_tag must be vX.Y.Z' }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify immutable tag, dispatch ref and locked toolchain
        id: release_identity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          if ((node --version).Trim() -cne "v$env:NODE_VERSION") { throw 'Unexpected Node.js version' }
          $uvVersion = ((uv --version).Trim() -split '\s+')[1]
          if ($uvVersion -cne $env:UV_VERSION) { throw "Unexpected uv version $uvVersion" }
          npm install --global "npm@$env:NPM_VERSION" --ignore-scripts --registry "$env:NPM_CONFIG_REGISTRY"
          if ((npm --version).Trim() -cne $env:NPM_VERSION) { throw 'Unexpected npm version' }
          uv python install $env:PYTHON_VERSION

          $version = (& node -p "require('./desktop/package.json').version").Trim()
          if ($version -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' -or $version -ceq '0.1.0') {
            throw 'Desktop version is invalid or retired'
          }
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag and desktop version do not match' }
          $tagCommit = (& git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}").Trim()
          $headCommit = (& git rev-parse HEAD).Trim()
          if ($tagCommit -cne $headCommit) { throw 'Checked-out tag does not resolve to HEAD' }
          if ($env:DISPATCH_COMMIT -cne $tagCommit) {
            throw 'Dispatch this workflow with --ref set to the same immutable release tag'
          }
          $headTree = (& git rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $headTree -cnotmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$') {
            throw 'Early-access release tree is not a canonical full Git object ID'
          }
          $nodePath = (Get-Command node -CommandType Application).Source
          $uvPath = (Get-Command uv -CommandType Application).Source
          $pythonPath = (& uv python find $env:PYTHON_VERSION).Trim()
          $npmRoot = (& npm root --global).Trim()
          $npmCliPath = Join-Path $npmRoot 'npm/bin/npm-cli.js'
          foreach ($toolPath in @($nodePath, $npmCliPath, $uvPath, $pythonPath)) {
            if (-not [IO.Path]::IsPathFullyQualified($toolPath) -or -not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
              throw "Pinned release tool path is not an absolute file: $toolPath"
            }
          }
          "NACHUAN_RELEASE_NODE_PATH=$nodePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NACHUAN_RELEASE_NPM_CLI_PATH=$npmCliPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NACHUAN_RELEASE_UV_PATH=$uvPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NACHUAN_RELEASE_PYTHON_PATH=$pythonPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NACHUAN_RELEASE_TREE=$headTree" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install and test the locked source checkout
        working-directory: desktop
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Locked desktop tests failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Locked desktop typecheck failed' }

      - name: Prepare checksum-pinned project-local Git runtime
        working-directory: desktop
        shell: pwsh
        run: |
          node scripts/git-runtime-policy.mjs prepare
          if ($LASTEXITCODE -ne 0) { throw 'Checksum-pinned Git runtime preparation failed' }
          node scripts/git-runtime-policy.mjs verify
          if ($LASTEXITCODE -ne 0) { throw 'Checksum-pinned Git runtime verification failed' }
          $gitPath = [IO.Path]::GetFullPath((Join-Path $PWD '..\build\git-runtime\mingw64\bin\git.exe'))
          if (-not (Test-Path -LiteralPath $gitPath -PathType Leaf)) {
            throw 'Checksum-pinned project-local Git core is missing'
          }
          "NACHUAN_RELEASE_GIT_PATH=$gitPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare canonical public update coordinates
        shell: pwsh
        env:
          PUBLIC_BASE: ${{ vars.NACHUAN_UPDATE_PUBLIC_BASE_URL }}
          VARIANT: ${{ inputs.variant }}
        run: |
          $script = @'
          const fs = require('node:fs')
          const base = new URL(process.env.PUBLIC_BASE)
          if (base.protocol !== 'https:' || base.username || base.password || base.search || base.hash) {
            throw new Error('NACHUAN_UPDATE_PUBLIC_BASE_URL must be credential-free HTTPS')
          }
          if (!base.pathname.endsWith('/')) base.pathname += '/'
          const manifest = new URL(`early-access-${process.env.VARIANT}-win-x64.json`, base)
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `NACHUAN_UPDATE_BASE_URL=${base.toString()}\nNACHUAN_UPDATE_MANIFEST_URL=${manifest.toString()}\n`,
            'utf8'
          )
          '@
          & node -e $script
          if ($LASTEXITCODE -ne 0) { throw 'Public update coordinate validation failed' }

      - name: Prepare signed root authorization and keyring floor
        id: update_root_authorization
        shell: pwsh
        env:
          ROOT_AUTHORIZATION_BASE64: ${{ vars.NACHUAN_UPDATE_ROOT_AUTHORIZATION_BASE64 }}
          EXPECTED_ROOT_KEY_ID: ${{ vars.NACHUAN_UPDATE_KEY_ID }}
          ROOT_PUBLIC_KEY_SPKI_BASE64: ${{ vars.NACHUAN_UPDATE_PUBLIC_KEY_SPKI_BASE64 }}
        run: |
          node desktop/scripts/materialize-early-access-signing-inputs.mjs root
          if ($LASTEXITCODE -ne 0) { throw 'Root authorization validation failed' }

      - name: Prepare all excluded early-access build inputs before source freeze
        working-directory: desktop
        shell: pwsh
        env:
          DMX_VARIANT: ${{ inputs.variant }}
          NACHUAN_UPDATE_TIER: early-access
          NACHUAN_UPDATE_CHANNEL: early-access-${{ inputs.variant }}-win-x64
          NACHUAN_UPDATE_KEY_ID: ${{ vars.NACHUAN_UPDATE_KEY_ID }}
          NACHUAN_UPDATE_PUBLIC_KEY_SPKI_BASE64: ${{ vars.NACHUAN_UPDATE_PUBLIC_KEY_SPKI_BASE64 }}
          NACHUAN_UPDATE_SEQUENCE: ${{ vars.NACHUAN_UPDATE_SEQUENCE }}
          NACHUAN_UPDATE_KEYRING_SEQUENCE: ${{ steps.update_root_authorization.outputs.keyring_sequence }}
          NACHUAN_UPDATE_KEYRING_SHA256: ${{ steps.update_root_authorization.outputs.keyring_sha256 }}
        run: |
          node scripts/python-release-policy.mjs sync
          if ($LASTEXITCODE -ne 0) { throw 'Release-selected Python synchronization failed' }
          node scripts/prepare-pack.mjs $env:DMX_VARIANT
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed early-access package input preparation failed' }
          npm run prepare:electron-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Checksum-pinned Electron runtime preparation failed' }
          npm run prepare:licenses
          if ($LASTEXITCODE -ne 0) { throw 'Complete payload license staging failed' }
          node scripts/python-release-policy.mjs build-engine
          if ($LASTEXITCODE -ne 0) { throw 'Release-selected engine build failed' }
          node scripts/write-engine-digest.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Engine integrity module materialization failed' }
          node scripts/write-update-trust.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Update trust module materialization failed' }
          node scripts/release-output.mjs clean
          if ($LASTEXITCODE -ne 0) { throw 'Early-access release output cleanup failed' }

      - name: Stabilize all excluded early-access roots before source freeze
        shell: pwsh
        run: |
          $excludedRoots = @(
            'bridge/__pycache__',
            'config/__pycache__',
            'desktop/.vite',
            'desktop/build/electron-runtime',
            'desktop/build/license-evidence',
            'desktop/coverage',
            'desktop/node_modules',
            'desktop/out',
            'desktop/release',
            'desktop/third-party-notices',
            'gateway/__pycache__',
            'gateway/providers/__pycache__',
            'orchestrator/__pycache__',
            'orchestrator/workflows/__pycache__',
            'scripts/__pycache__',
            'tests/__pycache__'
          )
          foreach ($relative in $excludedRoots) {
            $path = [IO.Path]::GetFullPath((Join-Path $PWD $relative))
            if (Test-Path -LiteralPath $path) {
              $item = Get-Item -LiteralPath $path -Force
              if (-not $item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "Excluded source root is not an ordinary directory: $relative"
              }
            } else {
              New-Item -ItemType Directory -Path $path -ErrorAction Stop | Out-Null
            }
          }

      - name: Fail closed until release legal policy is approved
        shell: pwsh
        run: |
          throw 'Early-access release is blocked: a versioned license allowlist, obligation policy, and external legal approval have not been established.'

      - name: Freeze complete early-access source and Git execution closure before build
        id: release_source_freeze
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw 'RUNNER_TEMP is required for the early-access source freeze'
          }
          $freeze = Join-Path $env:RUNNER_TEMP 'nachuan-early-access-source-freeze.json'
          if (Test-Path -LiteralPath $freeze) { throw 'Early-access source freeze path already exists' }
          node desktop/scripts/release-source-freeze.mjs write $freeze
          if ($LASTEXITCODE -ne 0) { throw 'Complete early-access pre-build source freeze failed' }
          $digest = (Get-FileHash -LiteralPath $freeze -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cnotmatch '^[0-9a-f]{64}$') { throw 'Early-access source freeze digest is invalid' }
          "source_freeze_path=$freeze" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_freeze_sha256=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build the real early-access package
        working-directory: desktop
        shell: pwsh
        env:
          DMX_VARIANT: ${{ inputs.variant }}
          NACHUAN_UPDATE_TIER: early-access
          NACHUAN_UPDATE_CHANNEL: early-access-${{ inputs.variant }}-win-x64
          NACHUAN_UPDATE_KEY_ID: ${{ vars.NACHUAN_UPDATE_KEY_ID }}
          NACHUAN_UPDATE_PUBLIC_KEY_SPKI_BASE64: ${{ vars.NACHUAN_UPDATE_PUBLIC_KEY_SPKI_BASE64 }}
          NACHUAN_UPDATE_SEQUENCE: ${{ vars.NACHUAN_UPDATE_SEQUENCE }}
          NACHUAN_UPDATE_KEYRING_SEQUENCE: ${{ steps.update_root_authorization.outputs.keyring_sequence }}
          NACHUAN_UPDATE_KEYRING_SHA256: ${{ steps.update_root_authorization.outputs.keyring_sha256 }}
        run: npm run _build_pack_early_frozen

      - name: Materialize threshold leaf signing keys
        id: update_signing_inputs
        shell: pwsh
        env:
          ROOT_AUTHORIZATION_FILE: ${{ steps.update_root_authorization.outputs.root_authorization_file }}
          LEAF_SIGNING_KEYS_BUNDLE_BASE64: ${{ secrets.NACHUAN_UPDATE_LEAF_SIGNING_KEYS_BUNDLE_BASE64 }}
          EXPECTED_ROOT_KEY_ID: ${{ vars.NACHUAN_UPDATE_KEY_ID }}
        run: |
          node desktop/scripts/materialize-early-access-signing-inputs.mjs leaves
          if ($LASTEXITCODE -ne 0) { throw 'Leaf signing input materialization failed' }

      - name: Finalize installer closure and signed update envelope
        working-directory: desktop
        shell: pwsh
        env:
          DMX_VARIANT: ${{ inputs.variant }}
          NACHUAN_UPDATE_TIER: early-access
          NACHUAN_UPDATE_CHANNEL: early-access-${{ inputs.variant }}-win-x64
          NACHUAN_UPDATE_KEY_ID: ${{ vars.NACHUAN_UPDATE_KEY_ID }}
          NACHUAN_UPDATE_PUBLIC_KEY_SPKI_BASE64: ${{ vars.NACHUAN_UPDATE_PUBLIC_KEY_SPKI_BASE64 }}
          NACHUAN_UPDATE_SEQUENCE: ${{ vars.NACHUAN_UPDATE_SEQUENCE }}
          NACHUAN_UPDATE_ROOT_AUTHORIZATION_FILE: ${{ steps.update_root_authorization.outputs.root_authorization_file }}
          NACHUAN_UPDATE_LEAF_SIGNING_KEYS_FILE: ${{ steps.update_signing_inputs.outputs.leaf_signing_keys_file }}
          NACHUAN_UPDATE_LEAF_PRIVATE_KEY_PASSPHRASE: ${{ secrets.NACHUAN_UPDATE_LEAF_PRIVATE_KEY_PASSPHRASE }}
          NACHUAN_RELEASE_TAG: ${{ inputs.release_tag }}
          NACHUAN_RELEASE_COMMIT: ${{ github.sha }}
          NACHUAN_RELEASE_RUN_ID: ${{ github.run_id }}
          NACHUAN_RELEASE_SOURCE_FREEZE_PATH: ${{ steps.release_source_freeze.outputs.source_freeze_path }}
          NACHUAN_RELEASE_SOURCE_FREEZE_SHA256: ${{ steps.release_source_freeze.outputs.source_freeze_sha256 }}
        run: npm run finalize:early -- $env:DMX_VARIANT

      - name: Remove materialized update signing inputs
        if: always()
        working-directory: desktop
        shell: pwsh
        run: |
          node scripts/cleanup-signing-material.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Materialized update signing input cleanup failed' }

      - name: Re-verify finalized early-access closure
        working-directory: desktop
        shell: pwsh
        env:
          DMX_VARIANT: ${{ inputs.variant }}
          NACHUAN_UPDATE_TIER: early-access
          NACHUAN_RELEASE_TAG: ${{ inputs.release_tag }}
          NACHUAN_RELEASE_COMMIT: ${{ github.sha }}
          NACHUAN_RELEASE_RUN_ID: ${{ github.run_id }}
          NACHUAN_RELEASE_SOURCE_FREEZE_PATH: ${{ steps.release_source_freeze.outputs.source_freeze_path }}
          NACHUAN_RELEASE_SOURCE_FREEZE_SHA256: ${{ steps.release_source_freeze.outputs.source_freeze_sha256 }}
        run: |
          node scripts/release-source-freeze.mjs verify "$env:NACHUAN_RELEASE_SOURCE_FREEZE_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'Final early-access source and Git closure verification failed' }
          node scripts/release-evidence.mjs verify $env:DMX_VARIANT
          if ($LASTEXITCODE -ne 0) { throw 'Final early-access release evidence verification failed' }
          node scripts/release-security.mjs scan release
          if ($LASTEXITCODE -ne 0) { throw 'Final early-access security scan failed' }

      - name: Remove early-access source freeze input
        if: always()
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw 'RUNNER_TEMP is required to clean the early-access source freeze'
          }
          $runnerTemp = [IO.Path]::GetFullPath((Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path).TrimEnd([char[]]'\/')
          $freeze = Join-Path $runnerTemp 'nachuan-early-access-source-freeze.json'
          if (Test-Path -LiteralPath $freeze) {
            $item = Get-Item -LiteralPath $freeze -Force
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Refusing to clean redirected or non-file early-access source freeze'
            }
            Remove-Item -LiteralPath $freeze -Force -ErrorAction Stop
          }
          if (Test-Path -LiteralPath $freeze) { throw 'Early-access source freeze cleanup left a residual file' }

      - name: Upload exact finalized artifact for the isolated publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nachuan-early-access-${{ steps.release_identity.outputs.release_version }}-${{ inputs.variant }}-final
          path: |
            desktop/release/nachuan-${{ steps.release_identity.outputs.release_version }}-${{ inputs.variant }}-early-access-unsigned-win.exe
            desktop/release/nachuan-${{ steps.release_identity.outputs.release_version }}-${{ inputs.variant }}-early-access-unsigned-win.exe.blockmap
            desktop/release/early-access-${{ inputs.variant }}.yml
            desktop/release/early-access-${{ inputs.variant }}-win-x64.json
            desktop/release/WIN_UNPACKED_MANIFEST.json
            desktop/release/SHA256SUMS
            desktop/release/NATIVE_SBOM.cdx.json
            desktop/release/NPM_AUDIT.json
            desktop/release/NPM_SBOM.cdx.json
            desktop/release/PYTHON_AUDIT.json
            desktop/release/PYTHON_SBOM.cdx.json
            desktop/release/RELEASE_EVIDENCE_MANIFEST.json
            desktop/release/win-unpacked/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
